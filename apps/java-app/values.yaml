replicaCount: 1
imagePullSecrets:
- name: nexus-registry
registry:
  host: "192.168.100.14:30083/test"
backend:
  image:
    repository: ci-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  postgresql:
    host: postgresql.postgresql.svc.cluster.local
    port: 5432
    database: ci-db
    user: postgres
  redis:
    host: redis-master.redis.svc.cluster.local
    port: 6379
  fluentd:
    enabled: false
    host: fluentd.fluentd.svc.cluster.local
    port: 24224
  debug: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 768Mi
frontend:
  image:
    repository: test/ci-frontend
    tag: "1.0.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
ingress:
  enabled: true
  className: traefik
  hosts:
  - host: app.local
    paths:
    - path: /api
      pathType: Prefix
      serviceName: backend
      servicePort: 8081
    - path: /
      pathType: Prefix
      serviceName: frontend
      servicePort: 80
