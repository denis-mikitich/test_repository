apiVersion: v1
kind: Service
metadata:
  name: nexus-docker
  namespace: nexus
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: repository
    app.kubernetes.io/instance: nexus
    app.kubernetes.io/name: nexus3
  ports:
    - name: docker
      port: 8083
      targetPort: 8083
      nodePort: 30083