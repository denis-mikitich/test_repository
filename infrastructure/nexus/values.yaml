fullnameOverride: nexus
replicas: 1
persistence:
  enabled: true
  size: 20Gi
service:
  type: ClusterIP
  port: 8081
  additionalPorts:
    - name: docker
      port: 8082
      targetPort: 8082
      protocol: TCP
ingress:
  enabled: false
chownDataDir: false
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi