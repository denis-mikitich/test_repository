apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.3.1
      helm:
        valueFiles:
          - $values/infrastructure/argocd-image-updater/values.yaml
    - repoURL: https://github.com/denis-mikitich/test_repository.git
      targetRevision: test-task
      ref: values
    - repoURL: https://github.com/denis-mikitich/test_repository.git
      targetRevision: test-task
      path: infrastructure/argocd-image-updater
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true